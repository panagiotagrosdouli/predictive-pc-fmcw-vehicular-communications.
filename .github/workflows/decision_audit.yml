name: Decision-level mechanism audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/08_run_decision_audit.py'
      - 'src/predictive_pc_fmcw/**'
      - 'configs/default.json'
      - '.github/workflows/decision_audit.yml'
  workflow_dispatch:

jobs:
  decision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check src tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Run decision-level audit
        run: python scripts/08_run_decision_audit.py --output artifacts/decision_audit
      - name: Verify audit cardinality
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('artifacts/decision_audit/decision_agreement.csv')
          rows=list(csv.DictReader(p.open()))
          assert len(rows)==80, len(rows)  # 4 regimes x 5 seeds x 4 comparisons
          s=list(csv.DictReader(Path('artifacts/decision_audit/chosen_state.csv').open()))
          assert len(s)==80, len(s)  # 4 regimes x 5 seeds x 4 policies
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: decision-level-mechanism-audit
          path: artifacts/decision_audit/
          retention-days: 14
