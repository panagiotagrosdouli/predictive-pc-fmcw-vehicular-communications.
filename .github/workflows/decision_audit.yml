name: Decision-level mechanism audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/08_run_decision_audit.py'
      - 'src/predictive_pc_fmcw/**'
      - 'tests/test_deadline_aware_lifetime_scheduler.py'
      - 'configs/default.json'
      - '.github/workflows/decision_audit.yml'
  workflow_dispatch:

jobs:
  decision-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Static checks
        run: |
          ruff check src tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Run decision-level audit
        run: python scripts/08_run_decision_audit.py --output artifacts/decision_audit
      - name: Verify audit cardinality
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          comparisons = Path('artifacts/decision_audit/decision_agreement.csv')
          rows = list(csv.DictReader(comparisons.open()))
          assert len(rows) == 120, len(rows)  # 4 regimes x 5 seeds x 6 pairs

          state = Path('artifacts/decision_audit/chosen_state.csv')
          state_rows = list(csv.DictReader(state.open()))
          assert len(state_rows) == 100, len(state_rows)  # 4 x 5 x 5 policies
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: decision-level-mechanism-audit
          path: artifacts/decision_audit/
          retention-days: 14
