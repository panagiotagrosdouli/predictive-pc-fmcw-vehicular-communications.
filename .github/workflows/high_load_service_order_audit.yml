name: High-load service-order audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/12_run_high_load_service_order_audit.py'
      - '.github/workflows/high_load_service_order_audit.yml'
      - 'src/predictive_pc_fmcw/**'
      - 'configs/default.json'
  workflow_dispatch:

jobs:
  service-order-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Run development-only mechanism audit
        run: |
          python scripts/12_run_high_load_service_order_audit.py \
            --config configs/default.json \
            --output artifacts/high_load_service_order_audit
      - name: Verify audit contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(Path(
              'artifacts/high_load_service_order_audit/summary.json'
          ).read_text())
          assert p['evidence_tier'] == 'EXECUTED_DIAGNOSTIC_DEVELOPMENT_ONLY'
          assert p['holdout_inspected'] is False
          assert p['development_seeds'] == list(range(20260901, 20260911))
          assert set(p['regimes']) == {'load_1p1', 'deadline_0p5'}
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: high-load-service-order-audit
          path: artifacts/high_load_service_order_audit/
          retention-days: 14
