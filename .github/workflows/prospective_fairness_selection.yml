name: Prospective fairness dev-holdout

on:
  push:
    branches: [main]
    paths:
      - 'configs/fairness_selection_protocol.json'
      - 'scripts/11_run_prospective_fairness_selection.py'
      - '.github/workflows/prospective_fairness_selection.yml'
      - 'src/predictive_pc_fmcw/**'
      - 'configs/default.json'
  workflow_dispatch:

jobs:
  prospective-fairness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - name: Static checks
        run: ruff check src tests scripts
      - name: Unit tests
        run: pytest -q
      - name: Run frozen development and holdout protocol
        run: |
          python scripts/11_run_prospective_fairness_selection.py \
            --protocol configs/fairness_selection_protocol.json \
            --output artifacts/prospective_fairness_selection
      - name: Verify prospective cardinality
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path(
              'artifacts/prospective_fairness_selection/'
              'prospective_fairness_selection.json'
          ).read_text())
          assert len(p['development_rows']) == 240
          if p['selected_fairness_weight'] is None:
              assert len(p['holdout_rows']) == 0
          else:
              assert len(p['holdout_rows']) == 80
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-fairness-dev-holdout
          path: artifacts/prospective_fairness_selection/
          retention-days: 14
